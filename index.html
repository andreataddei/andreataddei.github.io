<body>

<script>
(function () {
  // ============================================================
  // Metaballs — grid approximation + marching squares
  // Tutto in vanilla canvas: nessuna dipendenza esterna.
  // ============================================================
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");

  var CELL = 26;
  var ISO  = 1.0;
  var cols = 0, rows = 0, grid = [];

  var PAL = [
    [224, 138, 114],
    [196, 106, 86],
    [168, 84, 68],
    [220, 176, 166],
    [140, 64, 52],
    [232, 168, 150],
    [186, 120, 104]
  ];

  function softColor(t) {
    var cyc = t * 0.06;
    var i = Math.floor(cyc) % PAL.length;
    var f = cyc - Math.floor(cyc);
    var s = f * f * (3 - 2 * f);
    var j = (i + 1) % PAL.length;
    var mix = [];
    for (var k = 0; k < 3; k++) mix.push(PAL[i][k] * (1 - s) + PAL[j][k] * s);
    return mix;
  }

  var balls = [];
  var N = 6;
  for (var b = 0; b < N; b++) {
    balls.push({
      ax: 40 + Math.random() * 60,
      ay: 30 + Math.random() * 45,
      sx: 0.12 + Math.random() * 0.12,
      sy: 0.14 + Math.random() * 0.12,
      p: Math.random() * Math.PI * 2,
      r: 55 + Math.random() * 45
    });
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.ceil(canvas.width / CELL) + 1;
    rows = Math.ceil(canvas.height / CELL) + 1;
    grid = new Array(cols * rows);
  }
  window.addEventListener("resize", resize);
  resize();

  function field(x, y, t) {
    var v = 0, cx, cy;
    for (var i = 0; i < balls.length; i++) {
      var B = balls[i];
      cx = canvas.width / 2 + Math.sin(t * B.sx + B.p) * (canvas.width / 4.2 + B.ax);
      cy = canvas.height / 2 + Math.cos(t * B.sy + B.p * 1.7) * (canvas.height / 3.4 + B.ay);
      var rr = B.r * (1 + 0.18 * Math.sin(t * 0.5 + B.p));
      var dx = x - cx, dy = y - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 < 1) d2 = 1;
      v += (rr * rr) / d2;
    }
    return v;
  }

  function lerp(a, b, f) { return a + (b - a) * f; }

  function draw() {
    var t = performance.now() * 0.001;

    ctx.fillStyle = "#0a0808";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var col = softColor(t);
    var strokeCol = "rgba(" + Math.round(col[0]) + "," + Math.round(col[1]) + "," + Math.round(col[2]) + ",0.9)";

    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < balls.length; i++) {
      var B = balls[i];
      var cx = canvas.width / 2 + Math.sin(t * B.sx + B.p) * (canvas.width / 4.2 + B.ax);
      var cy = canvas.height / 2 + Math.cos(t * B.sy + B.p * 1.7) * (canvas.height / 3.4 + B.ay);
      var rr = B.r * (1 + 0.18 * Math.sin(t * 0.5 + B.p));
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr * 1.4);
      g.addColorStop(0, "rgba(" + Math.round(col[0]) + "," + Math.round(col[1]) + "," + Math.round(col[2]) + ",0.14)");
      g.addColorStop(1, "rgba(" + Math.round(col[0]) + "," + Math.round(col[1]) + "," + Math.round(col[2]) + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, rr * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    ctx.fillStyle = "rgba(220,176,166,0.10)";
    for (var gy = 0; gy < rows; gy++) {
      for (var gx = 0; gx < cols; gx++) {
        ctx.fillRect(gx * CELL - 1, gy * CELL - 1, 2, 2);
      }
    }

    for (var yy = 0; yy < rows; yy++) {
      for (var xx = 0; xx < cols; xx++) {
        grid[yy * cols + xx] = field(xx * CELL, yy * CELL, t);
      }
    }

    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";

    for (var y = 0; y < rows - 1; y++) {
      for (var x = 0; x < cols - 1; x++) {
        var x0 = x * CELL, y0 = y * CELL;
        var x1 = x0 + CELL, y1 = y0 + CELL;
        var tl = grid[y * cols + x];
        var tr = grid[y * cols + x + 1];
        var bl = grid[(y + 1) * cols + x];
        var br = grid[(y + 1) * cols + x + 1];

        function frac(a, b) {
          var den = b - a;
          if (Math.abs(den) < 1e-9) return 0.5;
          var f = (ISO - a) / den;
          if (f < 0) f = 0; if (f > 1) f = 1;
          return f;
        }

        var caseIndex = 0;
        if (tl > ISO) caseIndex |= 8;
        if (tr > ISO) caseIndex |= 4;
        if (br > ISO) caseIndex |= 2;
        if (bl > ISO) caseIndex |= 1;
        if (caseIndex === 0 || caseIndex === 15) continue;

        var top    = { x: lerp(x0, x1, frac(tl, tr)), y: y0 };
        var right  = { x: x1, y: lerp(y0, y1, frac(tr, br)) };
        var bottom = { x: lerp(x0, x1, frac(bl, br)), y: y1 };
        var left   = { x: x0, y: lerp(y0, y1, frac(tl, bl)) };

        ctx.beginPath();
        switch (caseIndex) {
          case 1:  case 14: ctx.moveTo(left.x, left.y); ctx.lineTo(bottom.x, bottom.y); break;
          case 2:  case 13: ctx.moveTo(bottom.x, bottom.y); ctx.lineTo(right.x, right.y); break;
          case 3:  case 12: ctx.moveTo(left.x, left.y); ctx.lineTo(right.x, right.y); break;
          case 4:  case 11: ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); break;
          case 5:
            ctx.moveTo(left.x, left.y); ctx.lineTo(top.x, top.y);
            ctx.stroke(); ctx.beginPath();
            ctx.moveTo(right.x, right.y); ctx.lineTo(bottom.x, bottom.y);
            break;
          case 6:  case 9:  ctx.moveTo(top.x, top.y); ctx.lineTo(bottom.x, bottom.y); break;
          case 7:  case 8:  ctx.moveTo(left.x, left.y); ctx.lineTo(top.x, top.y); break;
          case 10:
            ctx.moveTo(left.x, left.y); ctx.lineTo(bottom.x, bottom.y);
            ctx.stroke(); ctx.beginPath();
            ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y);
            break;
        }
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
